<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved copy — Stash</title>
    <style>
      :root {
        --bg: #f8f6f1; --surface: #fff; --ink: #1f1b16; --muted: #6b655a;
        --border: #e5e0d7; --accent: #c26847;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #17140f; --surface: #211d17; --ink: #efe9df; --muted: #a49b8c; --border: #322c23; --accent: #e08a63; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
      header .meta { min-width: 0; flex: 1; }
      header .title { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      header .url { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      header .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
      header a.live { font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); text-decoration: none; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
      #frame { flex: 1; width: 100%; border: 0; background: var(--surface); }
      #fallback { margin: auto; max-width: 26rem; text-align: center; padding: 40px 24px; color: var(--muted); }
      #fallback a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div class="meta">
        <div class="title" id="title">Saved copy</div>
        <div class="url" id="url"></div>
      </div>
      <span class="badge" id="badge"></span>
      <a class="live" id="live" href="#" target="_blank" rel="noreferrer">Open live page</a>
    </header>
    <iframe id="frame" sandbox=""></iframe>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
